[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["frontend/pages/migrations"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["D"]
"frontend/pages/tests.py" = ["D"]
"frontend/pages/test_*.py" = ["D"]

[tool.djlint]
profile = "django"
indent = 4
max_line_length = 100
format_css = false
format_js = false
# SVG use/symbol are not custom HTML elements; dimensions are supplied by CSS.
custom_html = "use,symbol"
ignore = "H006,H021,H030,H031"
